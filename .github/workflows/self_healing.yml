name: Playwright Self-Healing Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  heal-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Enables git push permissions for committing self-healed code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Playwright Browsers
        run: |
          npm ci || npm install
          npx playwright install --with-deps

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 1: Run Playwright tests first & dump output to failure.log
      - name: Run Playwright Tests
        id: playwright
        continue-on-error: true # Prevents CI from stopping immediately on test failure
        run: |
          npx playwright test marketingJourno.spec.ts > failure.log 2>&1

      # Step 2: Trigger Self-Healing Agent ONLY if the Playwright test failed
      - name: Execute Self-Healing Agent
        if: steps.playwright.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python self_healing_agent.py --spec marketingJourno.spec.ts --log failure.log --max-retries 2

      # Step 3: Commit and push patched files back to GitHub if fixes occurred
      - name: Commit & Push Self-Healed Code
        if: steps.playwright.outcome == 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix(self-healing): automated test repair via Llama 3.3" && git push)

      - name: Upload Bandit Memory / Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-artifacts
          path: |
            bandit_memory.json
            failure.log
            playwright-report/