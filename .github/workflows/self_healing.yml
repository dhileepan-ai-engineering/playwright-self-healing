name: Playwright Self-Healing Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  heal-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Playwright Browsers
        run: |
          npm ci || npm install
          npx playwright install --with-deps

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Self-Healing Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Replace paths with your actual spec file and log file locations
          python self_healing_agent.py --spec tests/marketing.spec.ts --log failure.log --max-retries 2

      - name: Upload Bandit Memory / Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-artifacts
          path: |
            bandit_memory.json
            playwright-report/